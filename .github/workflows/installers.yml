name: Build installers
# Runs on every v* tag (and attaches the files to a GitHub Release) and on demand.
# On the claude/** branch it only builds and keeps the files as workflow artifacts, so the setup can be tested without a release.
on:
  push:
    tags: ['v*']
    branches: ['claude/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows, args: '' }
          - { os: macos-latest, name: mac, args: '--target universal-apple-darwin' }
          - { os: ubuntu-22.04, name: linux, args: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Linux system libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - run: npm ci
      - run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android SDK licenses (the SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug-signed APK and unsigned AAB (no secrets needed)
        working-directory: android
        run: ./gradlew assembleDebug bundleRelease --no-daemon
      - name: Collect files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/Workbench-Toolbox-android.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/Workbench-Toolbox-android-unsigned.aab
      - uses: actions/upload-artifact@v4
        with: { name: installer-android, path: out/*, if-no-files-found: error }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: installer-*, merge-multiple: true }
      - run: ls -R dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Free and open source (Apache-2.0). Installers are unsigned, so Windows SmartScreen and macOS Gatekeeper will warn the first time. See "Install" in the README for how to open the app anyway.
            The Android .apk is for sideloading (signed with a debug key). The .aab is unsigned and is not for upload to Google Play.
            iPhone: open the web app in Safari and use Share, Add to Home Screen.
